# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: copilot-studio-labs-portal
metadata:
  template: copilot-studio-labs-portal@1.0.0

infra:
  provider: bicep
  path: ./infra

services:
